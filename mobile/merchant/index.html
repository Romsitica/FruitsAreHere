{% load static %}<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#00C853">
  <title>果子来了 · 商户端</title>
  {% comment %}
    ?v={% now 'U' %} 是给本地开发用的缓存穿透参数：每次整页加载都换一个 URL。
    之前反复出现「改了样式但浏览器还是旧的」，根因就是 app.js / app.css 的地址
    永远不变，浏览器有理由一直吃缓存。加时间戳后一刷新必定重新拉取。
    正式部署如果在意缓存命中率，把这里换成固定版本号即可。
  {% endcomment %}
  <link rel="stylesheet" href="{% static 'shared/theme.css' %}?v={% now 'U' %}">
  <link rel="stylesheet" href="{% static 'merchant/app.css' %}?v={% now 'U' %}">
</head>
<body>
  <div id="app"><div class="fm-app"><div class="fm-boot">正在加载商户工作台…</div></div></div>
  <script src="{% static 'vendor/vue.global.prod.js' %}"></script>
  <script src="{% static 'shared/api.js' %}?v={% now 'U' %}"></script>
  <script src="{% static 'merchant/app.js' %}?v={% now 'U' %}"></script>
</body>
</html>
