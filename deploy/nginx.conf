# 果子来了 · nginx 反向代理
# 由 deploy/bootstrap.sh 替换 __APP_DIR__ / __PORT__ / __SERVER_NAME__
# 静态文件（含 PC 版、两个移动端 APP 的 js/css、Vue/Bootstrap）交给 nginx 直接托管
server {
    listen 80 default_server;
    server_name __SERVER_NAME__;

    client_max_body_size 20m;

    # 我们的 JS/CSS 文件名不带版本号，绝不能强缓存，否则改版/改名后
    # 用户最长 7 天都看到旧内容。这里改用协商缓存：靠 ETag/Last-Modified，
    # 内容没变返回 304（几乎零开销），变了立刻生效。
    location /static/ {
        alias __APP_DIR__/staticfiles/;
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # 第三方库（Vue / Bootstrap）基本不变，可以放心长缓存
    location /static/vendor/ {
        alias __APP_DIR__/staticfiles/vendor/;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
